name: Refresh public-safety data
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests xlrd openpyxl numpy
      - name: Refresh live feeds (shootings/arrests/traffic/311/911/citations + 311 wait)
        env: { SOCRATA_APP_TOKEN: '${{ secrets.SOCRATA_APP_TOKEN }}' }
        run: python refresh_live.py
      - name: Refresh core data (CompStat crime + DV from NYPD Excel)
        run: python refresh_core.py
      - name: Commit updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-refresh ($(date -u +'%Y-%m-%d %H:%M'))" || echo "no changes"
          git push
